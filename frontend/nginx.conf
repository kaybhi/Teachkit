server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (e.g. /week/8, /dashboard) — fall
    # back to index.html for any path that isn't a real static file, otherwise
    # a browser refresh on those routes 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
